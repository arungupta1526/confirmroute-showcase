name: CI & Security Scan

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read       # 👈 Stage durations (e.g. 18s, 45s) fetch karne ke liye zaroori hai

# Cancel in-progress runs for PRs to save runner minutes, but queue safely on main branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # =============================================================
  # Stage 1 (Head of Snake): Secret Leak Detection
  # Halts immediately if any API keys, tokens, or credentials leak
  # =============================================================
  gitleaks:
    name: 🐍 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Git History for Gitleaks
        if: github.event_name == 'push'
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              echo "Before commit ${{ github.event.before }} is missing from history (rebase/squash detected). Overriding Gitleaks log opts."
              echo "GITLEAKS_LOG_OPTS=--max-count=20" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================
  # Stage 2: Dependency Security Audit
  # Runs ONLY after Stage 1 (Gitleaks) passes successfully
  # =============================================================
  security-audit:
    name: 🐍 2. Dependency Audit
    needs: [gitleaks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high

  # =============================================================
  # Stage 3: TypeScript Compilation & Production Build Check
  # Runs ONLY after Stage 2 (Dependency Audit) passes successfully
  # =============================================================
  build:
    name: 🐍 3. TypeScript & Next.js Build
    needs: [security-audit]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # =============================================================
  # Stage 4 (Tail of Snake): Unit & Invariant Test Verification
  # Runs ONLY after Stage 3 (Build) passes successfully
  # =============================================================
  test:
    name: 🐍 4. Unit Tests
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # =============================================================
  # Stage 5: Update ReviewGround Sticky Comment with CI Status
  # Runs after all stages, finds the existing review comment and edits (PATCH) it
  # =============================================================
  ci-summary:
    name: 📊 5. Update ReviewGround CI Summary
    needs: [gitleaks, security-audit, build, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Sticky PR Comment with CI Results
        uses: arungupta1526/ReviewGround@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: 'summary' # 👈 Sirf CI verification table update karega (No extra LLM API cost!)
          gitleaks-result: ${{ needs.gitleaks.result }}
          audit-result: ${{ needs.security-audit.result }}
          build-result: ${{ needs.build.result }}
          test-result: ${{ needs.test.result }}
