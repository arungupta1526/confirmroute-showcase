name: Docker DevSecOps Build, Scan & Push

on:
  # Chained Execution: Triggers automatically when the CI pipeline finishes on main
  workflow_run:
    workflows: ["CI & Security Scan"]
    types:
      - completed
    branches:
      - main
  # Manual trigger support from GitHub Actions UI tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

# Prevent duplicate parallel container builds; auto-cancel stale intermediate builds
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-delivery:
    name: 🐳 Docker DevSecOps & Registry Push
    # Only run if CI passed completely, or if manually triggered by user
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}"
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -------------------------------------------------------------
      # 1. Build Local Image for Security Scan
      # -------------------------------------------------------------
      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: confirmroute:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # 2. Automated Aqua Security Trivy Container Scan
      # -------------------------------------------------------------
      - name: Run Aqua Security Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'confirmroute:scan-target'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # -------------------------------------------------------------
      # 3. Log in to Docker Hub (if secrets configured via env)
      # -------------------------------------------------------------
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------
      # 4. Log in to GitHub Container Registry (GHCR)
      # -------------------------------------------------------------
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 5. Generate Registry Tags
      # -------------------------------------------------------------
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/confirmroute', env.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      # -------------------------------------------------------------
      # 6. Push Verified Image to Registries
      # -------------------------------------------------------------
      - name: Push Image to Registries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
